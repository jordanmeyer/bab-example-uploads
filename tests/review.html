<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Local production review</title><style>body{margin:0;font:14px Arial}header{padding:12px;display:flex;gap:20px;align-items:center}iframe{display:block;width:1440px;height:1100px;border:0}pre{white-space:pre-wrap;max-width:1400px}</style></head><body><header><label>Frame width <select id="width"><option>1440</option><option>390</option><option>320</option></select></label><label>Text size <select id="text-size"><option value="1">100%</option><option value="2">200%</option></select></label><button id="enlarge">Apply text size to current view</button><button id="measure">Measure current view</button></header><iframe title="App review frame" src="/app/"></iframe><pre id="report">Choose a width, then measure. Text enlargement changes fonts in this frame, not shared browser zoom. Reapply after opening a new view.</pre><script>
const frame=document.querySelector('iframe'),fonts=new Map();document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';
document.querySelector('#enlarge').onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument;for(const [el,s]of fonts)if(el.isConnected){el.style.fontSize=s.inline;el.style.lineHeight=s.lineInline;}const elements=[...d.querySelectorAll('body,body *')].filter(el=>!['SCRIPT','STYLE'].includes(el.tagName));for(const el of elements)if(!fonts.has(el)){const s=w.getComputedStyle(el);fonts.set(el,{size:parseFloat(s.fontSize),line:parseFloat(s.lineHeight),inline:el.style.fontSize,lineInline:el.style.lineHeight});}const factor=Number(document.querySelector('#text-size').value);if(factor===2)for(const el of elements){const s=fonts.get(el);el.style.fontSize=s.size*factor+'px';el.style.lineHeight=Number.isFinite(s.line)?s.line*factor+'px':'normal';}};
document.querySelector('#measure').onclick=async()=>{const w=frame.contentWindow,d=frame.contentDocument;await d.fonts.ready;document.querySelector('#report').textContent=JSON.stringify({width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,height:d.documentElement.scrollHeight,textFactor:Number(document.querySelector('#text-size').value),fonts:[...d.fonts].map(f=>({family:f.family,weight:f.weight,status:f.status})),externalRequests:w.performance.getEntriesByType('resource').filter(r=>new URL(r.name).origin!==location.origin).map(r=>r.name),smallControls:[...d.querySelectorAll('button,a,input,select,summary')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&(r.width<24||r.height<24)}).map(e=>({text:e.textContent.trim().slice(0,70),height:e.getBoundingClientRect().height,width:e.getBoundingClientRect().width})),headings:[...d.querySelectorAll('h1,h2')].map(e=>({text:e.textContent,font:w.getComputedStyle(e).fontSize})),dialogs:[...d.querySelectorAll('[role=dialog]')].map(e=>({width:e.clientWidth,scroll:e.scrollWidth,height:e.clientHeight,scrollHeight:e.scrollHeight}))},null,2)};
</script></body></html>
