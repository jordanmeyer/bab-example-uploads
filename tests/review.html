<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Local production review</title><style>body{margin:0;font:14px Arial}header{padding:12px;display:flex;gap:20px;align-items:center}iframe{display:block;width:1440px;height:1100px;border:0}pre{white-space:pre-wrap;max-width:1400px}</style></head><body><header><label>Frame width <select id="width"><option>1440</option><option>390</option><option>320</option></select></label><button id="measure">Measure current view</button></header><iframe title="App review frame" src="/app/"></iframe><pre id="report">Choose a width, then measure.</pre><script>
const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';document.querySelector('#measure').onclick=async()=>{const w=frame.contentWindow,d=frame.contentDocument;await d.fonts.ready;document.querySelector('#report').textContent=JSON.stringify({width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,height:d.documentElement.scrollHeight,fonts:[...d.fonts].map(f=>({family:f.family,weight:f.weight,status:f.status})),fontRequests:w.performance.getEntriesByType('resource').filter(r=>/ttf|woff/.test(r.name)).map(r=>({url:r.name,bytes:r.transferSize})),externalRequests:w.performance.getEntriesByType('resource').filter(r=>new URL(r.name).origin!==location.origin).map(r=>r.name),smallControls:[...d.querySelectorAll('button,a,input,select,summary')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&(r.width<24||r.height<24)}).map(e=>({text:e.textContent.trim().slice(0,70),height:e.getBoundingClientRect().height,width:e.getBoundingClientRect().width})),headings:[...d.querySelectorAll('h1,h2')].map(e=>e.textContent)},null,2)};
</script></body></html>
